name: Cloud APK Compiler Execution
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Build Automation
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Debug APK Application Installer
        run: ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload Finished Installer Asset
        uses: actions/upload-artifact@v4
        with:
          name: Gatekeeper-VMS-App
          path: app/build/outputs/apk/debug/app-debug.apk
